# Once a week: the full matrix of supported Pythons, the next pre-release (allowed to fail: it warns
# early, it never blocks), and the example lock's downloads, so a moved upstream file shows up here.
name: weekly

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported:
    if: ${{ !github.event.repository.private }}
    uses: ./.github/workflows/supported.yml

  next-python:
    name: tests on the next Python (allowed to fail)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.16"
          allow-prereleases: true

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  example-downloads:
    name: the example lock still matches its downloads
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify (the .deb against its vendor's index, without the 180 MB download)
        run: |
          python3 -I bin/input-lock verify --lock examples/lock.json --entry jq --entry shellcheck
          python3 -I bin/input-lock refresh --lock examples/lock.json --entry alloy
          git diff --exit-code examples/lock.json
